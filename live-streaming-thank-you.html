<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Live Streaming | EventStudio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<style>
  :root{--blue:#00aeef;--amber:#f2a93b;--bg:#0b0b0c;--panel:#141416;--line:#26262a;--text:#f2f2f0;--muted:#a8a8ad}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--blue)}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  header{padding:22px 0;border-bottom:1px solid var(--line)}
  header img{height:34px;display:block}
  main{padding:72px 0}
  .eyebrow{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:600;margin:0 0 14px}
  h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:0 0 18px;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--blue)}
  p{color:var(--muted);font-size:1.05rem;margin:0 0 18px}
  .next{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:20px 22px;margin:28px 0}
  .next strong{color:var(--text)}
  .next ol{margin:10px 0 0;padding-left:20px;color:var(--muted)}
  .btn{display:inline-block;background:var(--amber);color:#111;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:6px}
  footer{padding:30px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
</style>
<script defer src="/av-track.js"></script>
</head>
<body>
<header><div class="wrap"><a href="https://www.eventstudio.tv/"><img src="https://www.eventstudio.tv/eventstudio-logo-white-v2.png" alt="EventStudio"></a></div></header>
<main>
  <div class="wrap">
    <p class="eyebrow">Live streaming &middot; Enquiry received</p>
    <h1>Thank you. <em>We&rsquo;ve got your details.</em></h1>
    <p>Your enquiry is in. We reply within one business day.</p>

    <p>Questions in the meantime? Write to <a href="mailto:admin@eventstudio.tv">admin@eventstudio.tv</a> or call 416.271.7667.</p>
    <a class="btn" href="https://www.eventstudio.tv/">Back to EventStudio</a>
  </div>
</main>
<footer><div class="wrap">Eventstudio Ltd &middot; Oakville, Ontario</div></footer>

<!-- Chameleon Digital Media CONVERSION pixel (STREAMING). Fires once when this page loads.
     Deliberately no retargeting pixel here: these visitors have already converted. -->
<script type="text/javascript">
(function(){
  try{
    var ad='';
    try{ ad=(JSON.parse(localStorage.getItem('avt_tag')||'{}').cnt)||''; }catch(e){}
    var cdm=document.createElement('img');
    cdm.src='https://trk.osdrtb.net/u?c=ee3af0cd-5b43-487a-9a57-94187ea722aa&ev=STREAMING&subid='+encodeURIComponent(ad)+'&osrnd='+Math.round(new Date().getTime());
    cdm.setAttribute('referrerpolicy','no-referrer-when-downgrade');
    cdm.setAttribute('width','1');cdm.setAttribute('height','1');
    cdm.setAttribute('style','display:none');cdm.setAttribute('alt','');
    document.body.appendChild(cdm);
  }catch(e){}
})();
</script>
</body>
</html>

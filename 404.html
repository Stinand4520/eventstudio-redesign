<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal lost — Page not found | EventStudio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --black:#0b0b0c; --paper:#f5f1e8; --paper-dim: rgba(245,241,232,0.62); --amber:#f2a93b; --ease: cubic-bezier(.16,.84,.44,1); }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:var(--black); color:var(--paper); font-family:'Inter',sans-serif; }
  .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .eyebrow{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); margin-bottom:18px; }
  .eyebrow::before{ content:'● '; color:#e4392e; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:clamp(1.8rem,5vw,3rem); margin:0 0 16px; max-width:16ch; line-height:1.15; }
  p{ font-size:15px; color:var(--paper-dim); max-width:44ch; margin:0 0 32px; line-height:1.6; }
  a.btn{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:13px 22px; border:1px solid var(--amber); border-radius:2px; color:var(--black); background:var(--amber); text-decoration:none; transition: box-shadow .25s var(--ease); }
  a.btn:hover{ box-shadow:0 0 0 1px var(--amber), 0 8px 30px -8px rgba(242,169,59,0.5); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Signal lost</div>
  <h1>This page didn’t make the cut.</h1>
  <p>The show you’re looking for isn’t on this feed — wrong cue, old link, or a page that never made it to air. Let’s get you back to the booth.</p>
  <a class="btn" href="/">Back to EventStudio</a>
</div>
</body>
</html>
